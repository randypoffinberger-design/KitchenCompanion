<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1254 1254">
  <defs>
    <filter id="symbol-only" color-interpolation-filters="sRGB">
      <feColorMatrix type="luminanceToAlpha"/>
      <feComponentTransfer>
        <feFuncA type="discrete" tableValues="0 0 1 1 1"/>
      </feComponentTransfer>
    </filter>
    <mask id="approved-sk-symbol" mask-type="alpha">
      <image href="serenity-kitchen-icon-1024.png" xlink:href="serenity-kitchen-icon-1024.png" width="1254" height="1254" filter="url(#symbol-only)"/>
    </mask>
  </defs>
  <rect width="1254" height="1254" fill="black" mask="url(#approved-sk-symbol)"/>
</svg>
